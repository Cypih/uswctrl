[package]
name = "uswctl"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "uswctld"
path = "src/bin/uswctld.rs"

[[bin]]
name = "uswctl"
path = "src/bin/uswctl.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
rmcp = { version = "3.8.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
ureq = { version = "3.5.1", features = ["json"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["full", "test-util"] }
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
